name: Deploy APZ Docs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y pandoc texlive texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Build HTML docs
        run: |
          mkdir -p build/html
          for file in $(find docs -type f -name "*.md"); do
            pandoc "$file" -o "build/html/$(basename "$file" .md).html";
          done

      - name: Copy static HTML template (optional)
        run: |
          if [ -d "website" ]; then
            cp -r website/* build/html/
          fi

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
